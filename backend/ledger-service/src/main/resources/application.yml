server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

ledger:
  grpc:
    enabled: ${LEDGER_GRPC_ENABLED:true}
    port: ${LEDGER_GRPC_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
