server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payouts-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payouts_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payouts-service
      auto-offset-reset: earliest
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

platform:
  ledger:
    grpc-target: ${LEDGER_GRPC_TARGET:localhost:9091}
  services:
    pricing-url: ${PRICING_URL:http://localhost:8082}
    accounts-url: ${ACCOUNTS_URL:http://localhost:8084}
    simulator-url: ${SIMULATOR_URL:http://localhost:8089}

payouts:
  retry-interval-ms: ${PAYOUT_RETRY_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
