server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconciliation_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

  ai:
    chat:
      client:
        enabled: false
    model:
      chat: ${AI_CHAT_MODEL_PROVIDER:none}
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

platform:
  services:
    ledger-url: ${LEDGER_URL:http://localhost:8081}
    simulator-url: ${SIMULATOR_URL:http://localhost:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
