apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: fincore
  labels: { app: ledger-service }
spec:
  selector: { app: ledger-service }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
    - { name: grpc, port: 9091, targetPort: 9091 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: fincore
  labels: { app: ledger-service, app.kubernetes.io/part-of: fincore }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ledger-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: ledger-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: ledger-service
          image: fincore/ledger-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
            - { name: grpc, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-db }
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/ledger_db" }
            - { name: FLYWAY_ENABLED, value: "false" }   # migrations run in the Job below
            - { name: SERVER_PORT, value: "8081" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
# Runs Flyway once, then exits (platform.migrate-only=true). Apply before rolling out a new version.
# Jobs are immutable: delete the old one first (kubectl -n fincore delete job ledger-service-migrate).
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-service-migrate
  namespace: fincore
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: fincore/ledger-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-db }
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/ledger_db" }
            - { name: FLYWAY_ENABLED, value: "true" }
            - { name: LEDGER_GRPC_ENABLED, value: "false" }
            - name: JAVA_OPTS
              value: "-Dplatform.migrate-only=true -Dspring.main.web-application-type=none -Dplatform.outbox.relay-enabled=false -Dspring.kafka.listener.auto-startup=false -Dlending.jobs-enabled=false"
