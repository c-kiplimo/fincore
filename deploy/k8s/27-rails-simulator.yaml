apiVersion: v1
kind: Service
metadata:
  name: rails-simulator
  namespace: fincore
  labels: { app: rails-simulator }
spec:
  selector: { app: rails-simulator }
  ports:
    - { name: http, port: 8089, targetPort: 8089 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-simulator
  namespace: fincore
  labels: { app: rails-simulator, app.kubernetes.io/part-of: fincore }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rails-simulator }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: rails-simulator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8089"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: rails-simulator
          image: fincore/rails-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8089 }
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - { name: SERVER_PORT, value: "8089" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
