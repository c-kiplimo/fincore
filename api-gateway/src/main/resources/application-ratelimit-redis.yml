# Redis-backed rate limiting configuration for distributed deployments
# Use this profile for production with multiple gateway instances

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

gateway:
  rate-limit:
    type: redis  # Use Redis-backed rate limiting
    requests-per-second: 50
  api-version: 2026-10-01